      - Engines: internals/engines.md
      - Decide: internals/decide.md
      - Loop and Tools: internals/loop-and-tools.md
      - Judges: internals/judges.md
      - Runtime and Journal: internals/runtime.md
      - Spec-Driven Development: internals/spec-driven.md
      - API — REST, SSE, MCP: internals/api.md
      - CLI Reference: internals/cli.md
      - Observability: internals/observability.md
  - Insight:
      - Overview: internals/insight.md
      - Models: insight/models.md
      - Datasources: insight/datasources.md
      - AI Models: insight/ai-models.md
      - Embeddings & Collections: insight/embeddings-collections.md
      - IAM: insight/iam.md
      - Federation: insight/federation.md
      - API Docs: insight/api-docs.md
      - Settings: insight/settings.md
  - Configuration:
