site_name: tuvl
site_description: Typed workflows of agents — deterministic where they can be, bounded where they can't — on a durable, journaled runtime, built spec-first.
site_author: tuvl Team
site_url: https://tuvl.dev

repo_name: tuvl-io/tuvl
repo_url: https://github.com/tuvl-io/tuvl

theme:
  name: shadcn
  custom_dir: overrides
  icon: assets/logo-icon.svg
  favicon: assets/favicon.ico
  show_datetime: false
  katex_options: {}

plugins:
  - shadcn/search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  footer_links:
    - { title: Website, url: "https://tuvl.io" }
    - { title: Try it live, url: "https://try.tuvl.online" }
    - { title: GitHub, url: "https://github.com/tuvl-io/tuvl" }
    - { title: Examples, url: "https://github.com/tuvl-io/examples" }
    - { title: PyPI, url: "https://pypi.org/project/tuvl/" }
    - { title: Discord, url: "https://discord.gg/tuvl" }
  contact:
    developer: developer@tuvl.io
    security: security@tuvl.io
  generator: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/analytics.js

