      - Engines: internals/engines.md
      - Decide: internals/decide.md
      - Loop and Tools: internals/loop-and-tools.md
      - Judges: internals/judges.md
      - Runtime and Journal: internals/runtime.md
      - Spec-Driven Development: internals/spec-driven.md
      - API — REST, SSE, MCP: internals/api.md
